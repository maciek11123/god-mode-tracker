<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>God Mode Tracker - Mobile Ready</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#050508;overflow:hidden;font-family:'JetBrains Mono',monospace; user-select:none; touch-action:none; overscroll-behavior:none;}
    
    video{display:none;} 
    #three-canvas, #game-canvas {position:absolute;top:0;left:0;width:100vw;height:100dvh;object-fit:cover;z-index:1;}
    #game-canvas {z-index:2; display:none;}
    
    #ui{
        position:absolute;
        bottom:max(15px, env(safe-area-inset-bottom, 15px));
        left:50%;transform:translateX(-50%);
        display:flex;flex-direction:column;gap:8px;z-index:10;align-items:center;
        width: 100%; max-width: 900px;
        padding: 0 10px;
    }
    
    .panel{
        display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;
        background:rgba(10,10,15,0.8);padding:8px 12px;
        border-radius:12px;border:1px solid rgba(255,255,255,0.1);
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
        width: 100%;
    }
    
    .btn{
        padding:8px 14px;border-radius:6px;font-size:11px;letter-spacing:1px;
        text-transform:uppercase;font-family:inherit;cursor:pointer;
        border:1px solid rgba(255,255,255,0.1);
        background:transparent;color:rgba(255,255,255,0.5);
        transition:all .2s ease;
        -webkit-tap-highlight-color: transparent;
    }
    .btn:hover, .btn:active{background:rgba(255,255,255,0.05);color:#fff;}
    .btn.active{
        background:rgba(0,255,120,0.15);color:#00ff78;
        border-color:rgba(0,255,120,0.4);
    }
    .btn-alien{ color:#ff4444; border-color:rgba(255,68,68,0.3); }
    .btn-alien.active{ background:rgba(255,68,68,0.15); border-color:rgba(255,68,68,0.6); color:#ff4444;}
    
    .btn-game{ color:#00c8ff; border-color:rgba(0,200,255,0.3); }
    .btn-game.active{ background:rgba(0,200,255,0.15); border-color:rgba(0,200,255,0.6); color:#fff;}
    
    #hud{
        position:absolute;
        top:max(20px, env(safe-area-inset-top, 20px));
        left:max(20px, env(safe-area-inset-left, 20px));
        z-index:10;
        color:rgba(255,255,255,0.4);font-size:11px;text-transform:uppercase;letter-spacing:2px;
        display: flex; flex-direction: column; gap: 4px;
        pointer-events: none;
    }
    #status{color:#ffaa00;}
    #gesture-status{color:#00c8ff; font-weight: 900; letter-spacing: 2px;}
    
    #game-ui{
        position:absolute;
        top:max(20px, env(safe-area-inset-top, 20px));
        right:max(30px, env(safe-area-inset-right, 30px));
        z-index:10;display:none;
        font-size:24px;color:#fff;font-weight:bold;font-family:sans-serif;
        text-shadow: 0px 4px 15px rgba(0,0,0,0.8);
        pointer-events: none;
    }

    @media (max-width: 600px) {
        .btn { padding: 6px 8px; font-size: 9px; letter-spacing: 0.5px; }
        .panel { padding: 6px 8px; gap: 4px; border-radius: 10px; }
        #phone-icon { width: 28px !important; height: 28px !important; }
        #game-ui { font-size: 18px; right: 20px; }
        #hud { font-size: 9px; }
        .divider { height: 12px !important; margin: 0 2px !important; }
    }
</style>
</head>
<body>

    <video id="cam" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="game-canvas"></canvas>
    
    <div id="hud">
        <div>FPS: <span id="fps">0</span> | <span id="status">Searching Hands...</span></div>
        <div id="gesture-status">GESTURE: IDLE</div>
    </div>
    <div id="game-ui">SCORE: <span id="score">0</span></div>

    <div id="ui">
        <div class="panel">
            <button class="btn mode-btn active" id="btn-pond" onclick="setMode('pond', 'world')">Pond</button>
            <button class="btn mode-btn" id="btn-nebula" onclick="setMode('nebula', 'world')">Nebula</button>
            <button class="btn mode-btn" id="btn-gravity" onclick="setMode('gravity', 'world')">Gravity</button>
            <button class="btn mode-btn" id="btn-storm" onclick="setMode('storm', 'world')">Storm</button>
            <button class="btn mode-btn" id="btn-shatter" onclick="setMode('shatter', 'world')">Shatter</button>
            <button class="btn mode-btn" id="btn-magnetic" onclick="setMode('magnetic', 'world')">Magnetic</button>
            <div class="divider" style="width:1px;background:rgba(255,255,255,0.2);margin:0 4px;height:16px;"></div>
            <button class="btn mode-btn btn-alien" id="btn-alien" onclick="setMode('alien', 'world')">Alien</button>
            <button class="btn mode-btn btn-alien" id="btn-heavy" onclick="setMode('heavy', 'world')">Heavy</button>
        </div>

        <div class="panel">
            <button class="btn mode-btn btn-game" id="btn-bubbles" onclick="setMode('bubbles', 'game')">&#x1FAE7; Bubbles</button>
            <button class="btn mode-btn btn-game" id="btn-fruits" onclick="setMode('fruits', 'game')">&#x1F349; Fruits</button>
            <div class="divider" style="width:1px;background:rgba(255,255,255,0.2);margin:0 4px;height:16px;"></div>
            <button class="btn res" onclick="setRes('low')" id="res-low">Low</button>
            <button class="btn res active" onclick="setRes('med')" id="res-med">Med</button>
            <button class="btn res" onclick="setRes('high')" id="res-high">High</button>
        </div>

        <div class="panel" style="background: rgba(0, 200, 255, 0.15); border-color: rgba(0, 200, 255, 0.5);">
            <span style="font-size: 10px; color: #fff; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;">Mount:</span>
            <button class="btn" onclick="toggleCamRotation()" title="Rotate Webcam 90&#xB0;" style="background: transparent; border: none; padding: 2px; margin: 0 4px;">
                <svg id="phone-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8));">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <circle cx="12" cy="18" r="1"></circle>
                    <circle cx="12" cy="6" r="1.5" fill="#ffffff"></circle>
                </svg>
            </button>
            <span id="cam-deg" style="font-size: 13px; color: #00ff78; font-weight: 900; width: 28px; text-align: right;">0&#xB0;</span>
        </div>
    </div>

<script>
    // --- Environment Detection ---
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    const videoElement = document.getElementById('cam');
    const threeCanvas = document.getElementById('three-canvas');
    const gameCanvas = document.getElementById('game-canvas');
    const ctx = gameCanvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const gestureStatusEl = document.getElementById('gesture-status');
    const fpsEl = document.getElementById('fps');
    const scoreEl = document.getElementById('score');

    let W = window.innerWidth, H = window.innerHeight;
    gameCanvas.width = W; gameCanvas.height = H;

    let lastFrameTime = performance.now();
    let frameCount = 0, time = 0;
    
    // Default to Low res on mobile to prevent thermal throttling
    let currentMode = 'pond';
    let currentCategory = 'world';
    let currentRes = isMobile ? 'low' : 'med'; 
    let resMult = {low:0.3, med:1.0, high:2.0}[currentRes];
    let gameScore = 0;

    // --- Camera Rotation State ---
    let camRotation = 0;
    const processCanvas = document.createElement('canvas');
    const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });

    window.toggleCamRotation = function() {
        camRotation = (camRotation + 90) % 360;
        document.getElementById('phone-icon').style.transform = `rotate(${camRotation}deg)`;
        document.getElementById('cam-deg').innerText = `${camRotation}\u00B0`;
        
        if (statusEl.textContent.includes("Searching")) {
            statusEl.textContent = `Searching... (${camRotation}\u00B0)`;
        } else if (statusEl.textContent.includes("Tracking")) {
            statusEl.textContent = `Tracking (${camRotation}\u00B0)`;
        }
    };

    // --- Gesture & Physics State ---
    let gesture = { count: 0, fist: false, zoom: 1.0, angle: 0, midX: 0.5, midY: 0.5, h1: null, h2: null };
    let s_scale = 1.0, s_rotZ = 0, s_rotX = 0, s_rotY = 0, s_fist = 0.0;

    // Math Utilities
    function hsl(h,s,l){h=((h%1)+1)%1;var a=s*Math.min(l,1-l);function f(n){var k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}return[f(0),f(8),f(4)]}
    function n3(x,y,z){var X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),fx=x-X,fy=y-Y,fz=z-Z;function h(a,b,c){var v=(a*374761393+b*668265263+c*1274126177)^(a>>>13);v=(v^(v>>>16))*0x45d9f3b;return((v^(v>>>16))&0xfff)/0xfff-.5}function L(a,b,t){return a+(b-a)*t*t*(3-2*t)}return L(L(L(h(X,Y,Z),h(X+1,Y,Z),fx),L(h(X,Y+1,Z),h(X+1,Y+1,Z),fx),fy),L(L(h(X,Y,Z+1),h(X+1,Y,Z+1),fx),L(h(X,Y+1,Z+1),h(X+1,Y+1,Z+1),fx),fy),fz)}

    // --- Three.js Core Setup ---
    const scene = new THREE.Scene();
    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    const camera = new THREE.PerspectiveCamera(75, W/H, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: false });
    renderer.setSize(W, H);
    // Cap pixel ratio on mobile to save GPU cycles
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));

    let orbit={theta:0,phi:Math.PI/3,radius:16}, orbitTarget=new THREE.Vector3(0,0,0);
    function syncOrbit(){var d=camera.position.clone().sub(orbitTarget);orbit.radius=d.length();orbit.phi=Math.acos(Math.max(-1,Math.min(1,d.y/orbit.radius)));orbit.theta=Math.atan2(d.x,d.z)}
    var rayP=new THREE.Plane(new THREE.Vector3(0,1,0),0), rc=new THREE.Raycaster(), ip=new THREE.Vector3();
    function s2w(cx,cy){rc.setFromCamera({x:(cx/W)*2-1,y:-(cy/H)*2+1},camera);if(rc.ray.intersectPlane(rayP,ip))return{x:ip.x,z:ip.z,hit:true};return{x:0,z:0,hit:false}}

    let activeWorld = null;

    function buildLifeform(isHeavy) {
        const radius = isHeavy ? 170 : 160;
        const IcoDetail = currentRes === 'low' ? 3 : (currentRes === 'high' ? 5 : 4);
        const baseGeo = new THREE.IcosahedronGeometry(radius, IcoDetail);
        const baseVerts = baseGeo.attributes.position.array;
        
        const count = baseVerts.length / 3;
        const geo = new THREE.BufferGeometry();
        
        const ps = new Float32Array(baseVerts.length);
        const ops = new Float32Array(baseVerts.length);
        const vs = new Float32Array(baseVerts.length);
        const ro = new Float32Array(baseVerts.length);

        for (let i = 0; i < count; i++) {
            let ix = i*3, iy = i*3+1, iz = i*3+2;
            let vec = new THREE.Vector3(baseVerts[ix], baseVerts[iy], baseVerts[iz]).normalize();
            let dist = 1.0 + (Math.random() * (isHeavy ? 1.4 : 1.2) - (isHeavy ? 0.7 : 0.6)); 
            
            ps[ix] = ops[ix] = vec.x * radius * dist;
            ps[iy] = ops[iy] = vec.y * radius * dist;
            ps[iz] = ops[iz] = vec.z * radius * dist;
            
            vs[ix] = vs[iy] = vs[iz] = 0;
            ro[ix] = Math.random() * Math.PI*2; ro[iy] = Math.random() * Math.PI*2; ro[iz] = Math.random() * Math.PI*2;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(ps, 3));
        geo.setIndex(baseGeo.index);

        const pMat = new THREE.PointsMaterial({ color: 0xdddddd, size: isHeavy ? 2.0 : 1.2, transparent: true, opacity: isHeavy ? 0.95 : 0.7 });
        const lMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: isHeavy ? 0.35 : 0.12 });

        const pts = new THREE.Points(geo, pMat);
        const lns = new THREE.LineSegments(geo, lMat);
        const grp = new THREE.Group(); grp.add(pts); grp.add(lns);
        worldGroup.add(grp);

        const cfg = isHeavy 
            ? { iSpr: 0.008, aSpr: 0.003, fric: 0.92, ampI: 10.0, spdI: 0.1, ampA: 60.0, spdA: 0.6 }
            : { iSpr: 0.02, aSpr: 0.008, fric: 0.85, ampI: 4.0, spdI: 0.3, ampA: 40.0, spdA: 3.0 };

        return {
            m: [grp], dc: function(){ camera.position.set(0,0,450); camera.lookAt(0,0,0); }, bg: [0.03,0.03,0.03],
            up: function(dt) {
                const isAgitated = gesture.count === 2 || s_fist > 0.1;
                const curSpr = isAgitated ? cfg.aSpr : cfg.iSpr;
                const wAmp = isAgitated ? cfg.ampA : cfg.ampI;
                const wSpd = isAgitated ? cfg.spdA : cfg.spdI;

                for (let i = 0; i < count; i++) {
                    let ix = i*3, iy = i*3+1, iz = i*3+2;
                    let comp = 1.0 - (s_fist * 0.9); 
                    
                    let tx = ops[ix]*comp + Math.sin(time*wSpd + ro[ix])*wAmp;
                    let ty = ops[iy]*comp + Math.cos(time*wSpd + ro[iy])*wAmp;
                    let tz = ops[iz]*comp + Math.sin(time*wSpd + ro[iz])*wAmp;

                    vs[ix] += (tx - ps[ix]) * curSpr;
                    vs[iy] += (ty - ps[iy]) * curSpr;
                    vs[iz] += (tz - ps[iz]) * curSpr;

                    if (isAgitated && !isHeavy) {
                        vs[ix] += (Math.random()-0.5)*3.0; vs[iy] += (Math.random()-0.5)*3.0; vs[iz] += (Math.random()-0.5)*3.0;
                    } else if (isAgitated && isHeavy) {
                        vs[ix] += Math.sin(time*1.5 + ro[ix])*0.6; vs[iy] += Math.cos(time*2.0 + ro[iy])*0.6; vs[iz] += Math.sin(time*1.0 + ro[iz])*0.6;
                    }

                    vs[ix] *= cfg.fric; vs[iy] *= cfg.fric; vs[iz] *= cfg.fric;
                    ps[ix] += vs[ix]; ps[iy] += vs[iy]; ps[iz] += vs[iz];
                }
                pts.geometry.attributes.position.needsUpdate = true;
            },
            pm: function(wx, wz, str) { } 
        };
    }

    const Worlds = {
        alien: function() { return buildLifeform(false); },
        heavy: function() { return buildLifeform(true); },
        pond: function(){
            var G=Math.floor(220*Math.sqrt(resMult)),SZ=55,geo=new THREE.PlaneGeometry(SZ,SZ,G,G);geo.rotateX(-Math.PI/2);
            var pos=geo.attributes.position,N=pos.count,C=G+1,cur=new Float32Array(N),vel=new Float32Array(N),edg=new Float32Array(N),B=Math.floor(G*.08);
            for(var r=0;r<C;r++)for(var c=0;c<C;c++){var i=r*C+c;edg[i]=Math.min(1,Math.min(Math.min(c,G-c)/B,Math.min(r,G-r)/B))}
            var cols=new Float32Array(N*3);geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
            var pts=new THREE.Points(geo,new THREE.PointsMaterial({vertexColors:true,size:0.07,sizeAttenuation:true}));
            worldGroup.add(pts);
            function dist(wx,wz,str){var rd=1.5*Math.max(.3,str);for(var i=0;i<N;i++){var dx=pos.getX(i)-wx,dz=pos.getZ(i)-wz,d2=dx*dx+dz*dz;if(d2<rd*rd)cur[i]-=str*Math.cos(Math.sqrt(d2)/rd*Math.PI*.5)*1.8}}
            var hO=0;
            return{m:[pts],dc:function(){camera.position.set(0,14,1);camera.lookAt(0,0,-3);orbitTarget.set(0,0,-4);syncOrbit()},bg:[0,0,.03],
            up:function(dt){hO=(hO+dt/40)%1;for(var r=1;r<C-1;r++)for(var c=1;c<C-1;c++){var i=r*C+c,lp=cur[(r-1)*C+c]+cur[(r+1)*C+c]+cur[r*C+(c-1)]+cur[r*C+(c+1)]-4*cur[i];vel[i]=(vel[i]+.34*lp)*(.986-(1-edg[i])*.15)}
            for(var i=0;i<N;i++)cur[i]=(cur[i]+vel[i])*edg[i];var cl=geo.attributes.color,bH=.55+Math.sin(hO*Math.PI*2)*.2;
            for(var i=0;i<N;i++){var h=cur[i]; 
            cur[i] *= (1.0 - 0.2 * s_fist); 
            var fh=bH+h*.05,rgb=hsl(fh,.8+Math.min(.2,Math.abs(h)*.12),Math.max(.04,Math.min(.65,.14+Math.abs(h)*.25)));cl.setXYZ(i,rgb[0],rgb[1],rgb[2]);pos.setY(i,h*.6)}cl.needsUpdate=true;pos.needsUpdate=true;},
            pm:function(wx,wz,str){dist(wx,wz,str*.5)}}
        },
        nebula: function(){
            var CT=Math.floor(50000*resMult),geo=new THREE.BufferGeometry(),ps=new Float32Array(CT*3),cs=new Float32Array(CT*3),bp=new Float32Array(CT*3),vs=new Float32Array(CT*3);
            for(var i=0;i<CT;i++){var th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),rr=Math.pow(Math.random(),.5)*18,x=rr*Math.sin(ph)*Math.cos(th),y=rr*Math.cos(ph)*.3,z=rr*Math.sin(ph)*Math.sin(th);ps[i*3]=x;ps[i*3+1]=y;ps[i*3+2]=z;bp[i*3]=x;bp[i*3+1]=y;bp[i*3+2]=z}
            geo.setAttribute('position',new THREE.BufferAttribute(ps,3));geo.setAttribute('color',new THREE.BufferAttribute(cs,3));
            var pts=new THREE.Points(geo,new THREE.PointsMaterial({vertexColors:true,size:.06,transparent:true,opacity:.7}));worldGroup.add(pts);var att=[],hO=0;
            return{m:[pts],dc:function(){camera.position.set(0,8,25);camera.lookAt(0,0,0);orbitTarget.set(0,0,0);syncOrbit()},bg:[.02,0,.04],
            up:function(dt){hO=(hO+dt/50)%1;var t=time*.15,pos=geo.attributes.position,col=geo.attributes.color;
            for(var i=0;i<CT;i++){var x=ps[i*3],y=ps[i*3+1],z=ps[i*3+2],sc=.08;
            let cx = bp[i*3] * (1.0 - s_fist), cy = bp[i*3+1] * (1.0 - s_fist), cz = bp[i*3+2] * (1.0 - s_fist); 
            vs[i*3]+=(n3(x*sc+t,y*sc,z*sc)*.6+(cx-x)*.008)*dt;vs[i*3+1]+=(n3(x*sc,y*sc+t,z*sc)*.2+(cy-y)*.012)*dt;vs[i*3+2]+=(n3(x*sc,y*sc,z*sc+t)*.6+(cz-z)*.008)*dt;
            for(var j=0;j<att.length;j++){var a=att[j],dx=a.x-x,dy=a.y-y,dz=a.z-z,d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.5,f=a.s/(d*d)*dt*8;vs[i*3]+=dx/d*f;vs[i*3+1]+=dy/d*f;vs[i*3+2]+=dz/d*f}
            vs[i*3]*=.96;vs[i*3+1]*=.96;vs[i*3+2]*=.96;x+=vs[i*3];y+=vs[i*3+1];z+=vs[i*3+2];ps[i*3]=x;ps[i*3+1]=y;ps[i*3+2]=z;
            var rgb=hsl(.75+hO+Math.sqrt(x*x+y*y+z*z)*.01,.7,Math.min(.6,.08+Math.sqrt(vs[i*3]*vs[i*3]+vs[i*3+1]*vs[i*3+1])*3));col.setXYZ(i,rgb[0],rgb[1],rgb[2])}pos.needsUpdate=true;col.needsUpdate=true;
            for(var j=att.length-1;j>=0;j--){att[j].s*=.97;if(Math.abs(att[j].s)<.01)att.splice(j,1)}},
            pm:function(wx,wz,str){att.push({x:wx,y:0,z:wz,s:str*1.5})}}
        },
        gravity: function(){
            var CT=Math.floor(45000*resMult),geo=new THREE.BufferGeometry(),ps=new Float32Array(CT*3),cs=new Float32Array(CT*3),vs=new Float32Array(CT*3),ms=new Float32Array(CT);
            var sd=Math.ceil(Math.sqrt(CT));for(var i=0;i<CT;i++){ps[i*3]=(i%sd/sd-.5)*50;ps[i*3+1]=0;ps[i*3+2]=(Math.floor(i/sd)/sd-.5)*50;ms[i]=.5+Math.random()*.5}
            geo.setAttribute('position',new THREE.BufferAttribute(ps,3));geo.setAttribute('color',new THREE.BufferAttribute(cs,3));
            var pts=new THREE.Points(geo,new THREE.PointsMaterial({vertexColors:true,size:.06,transparent:true,opacity:.85}));worldGroup.add(pts);var wls=[],aw=[{a:0,d:8,sp:.3,s:2.5}],hO=0;
            return{m:[pts],dc:function(){camera.position.set(0,22,12);camera.lookAt(0,0,-2);orbitTarget.set(0,0,-2);syncOrbit()},bg:[.01,.005,0],
            up:function(dt){hO=(hO+dt/35)%1;var pos=geo.attributes.position,col=geo.attributes.color;for(var a=0;a<aw.length;a++)aw[a].a+=aw[a].sp*dt;
            for(var i=0;i<CT;i++){var x=ps[i*3],y=ps[i*3+1],z=ps[i*3+2];
            for(var j=0;j<wls.length;j++){var w=wls[j],dx=w.x-x,dz=w.z-z,d=Math.sqrt(dx*dx+dz*dz)+.5,f=w.s*ms[i]/(d*d)*dt*6;vs[i*3]+=dx/d*f;vs[i*3+2]+=dz/d*f;if(d<3)vs[i*3+1]+=(3-d)*.02*w.s*dt}
            if(s_fist > 0.01) { vs[i*3]-=x*0.03*s_fist; vs[i*3+2]-=z*0.03*s_fist; vs[i*3+1]-=y*0.03*s_fist; }

    // --- Games State & Logic ---
    let entities = [];
    let particles2D = [];
    const BUBBLE_COLORS = ['#ff6464','#ffa532','#64dc64','#64b4ff','#b464ff'];
    const FRUIT_TYPES = [{e:'\uD83C\uDF4D',c:'255,223,0'},{e:'\uD83C\uDF4A',c:'255,165,0'},{e:'\uD83C\uDF49',c:'252,108,133'},{e:'\uD83C\uDF4F',c:'141,182,0'},{e:'\uD83C\uDF47',c:'111,45,168'}];

    function spawnGameEntity() {
        if (currentMode === 'bubbles') {
            entities.push({x: Math.random()*W, y: H+50, r: 30+Math.random()*40, sy: 1.5+Math.random()*2, sx: (Math.random()-0.5)*0.8, wobble: Math.random()*Math.PI*2, color: BUBBLE_COLORS[Math.floor(Math.random()*BUBBLE_COLORS.length)]});
        } else if (currentMode === 'fruits') {
            let t = FRUIT_TYPES[Math.floor(Math.random()*FRUIT_TYPES.length)];
            entities.push({x: Math.random()*W, y: H+50, r: 60+Math.random()*30, sy: 3+Math.random()*3, seed: Math.random()*100, emoji: t.e, color: t.c});
        }
    }

    function createSplash(x, y, colorStr, isFruit) {
        for(let i=0; i<15; i++) {
            particles2D.push({
                x: x, y: y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                r: Math.random()*(isFruit?6:4)+2, color: isFruit ? `rgba(${colorStr},` : colorStr,
                alpha: 1, isFruit: isFruit
            });
        }
    }

    // --- System Control ---
    function setRes(res) {
        currentRes = res;
        resMult = {low:0.3, med:1.0, high:2.0}[res];
        document.querySelectorAll('.res').forEach(b => b.classList.remove('active'));
        document.getElementById(`res-${res}`).classList.add('active');
        if(currentCategory === 'world') setMode(currentMode, 'world');
    }

    window.setMode = function(mode, category) {
        currentMode = mode;
        currentCategory = category;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');

        if (category === 'world') {
            threeCanvas.style.display = 'block';
            gameCanvas.style.display = 'none';
            document.getElementById('game-ui').style.display = 'none';
            
            while(worldGroup.children.length) worldGroup.remove(worldGroup.children[0]);
            
            s_scale = 1.0; s_rotZ = 0; s_rotX = 0; s_rotY = 0;
            worldGroup.scale.set(1,1,1);
            worldGroup.rotation.set(0,0,0);

            activeWorld = Worlds[mode]();
            activeWorld.dc();
            let bg = activeWorld.bg;
            renderer.setClearColor(new THREE.Color(bg[0], bg[1], bg[2]));
        } else {
            threeCanvas.style.display = 'none';
            gameCanvas.style.display = 'block';
            document.getElementById('game-ui').style.display = 'block';
            
            gameScore = 0;
            scoreEl.innerText = gameScore;
            entities = [];
            particles2D = [];
        }
    };

    // Initialize UI state
    document.getElementById(`res-${currentRes}`).classList.add('active');
    document.querySelectorAll('.res').forEach(b => {
        if(b.id !== `res-${currentRes}`) b.classList.remove('active');
    });

    // --- Main Loop ---
    function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;
        time += dt;

        frameCount++;
        if (frameCount % 60 === 0) { fpsEl.innerText = Math.round(1/dt); }

        if (currentCategory === 'world' && activeWorld) {
            
            let t_scale = s_scale, t_rotZ = s_rotZ, t_rotX = s_rotX, t_rotY = s_rotY;
            
            if (gesture.count === 2) {
                t_scale = Math.max(0.1, gesture.zoom * 3.5);
                t_rotZ = gesture.angle;
                t_rotX = (gesture.midY - 0.5) * Math.PI;
                t_rotY = (gesture.midX - 0.5) * Math.PI;
            } else if (gesture.count === 1) {
                t_scale = s_scale;
                t_rotZ = s_rotZ;
                t_rotX = s_rotX;
                t_rotY = s_rotY;
            } else {
                t_scale = 1.0; 
                if (currentMode === 'alien' || currentMode === 'heavy') {
                    t_rotX = s_rotX + 0.003;
                    t_rotY = s_rotY + 0.005;
                }
            }

            s_scale += (t_scale - s_scale) * 0.06;
            
            let drZ = t_rotZ - s_rotZ;
            while(drZ > Math.PI) drZ -= Math.PI*2;
            while(drZ < -Math.PI) drZ += Math.PI*2;
            s_rotZ += drZ * 0.09;
            
            s_rotX += (t_rotX - s_rotX) * 0.06;
            s_rotY += (t_rotY - s_rotY) * 0.06;

            s_fist += ((gesture.fist ? 1.0 : 0.0) - s_fist) * 0.06;

            worldGroup.scale.set(s_scale, s_scale, s_scale);
            worldGroup.rotation.set(s_rotX, s_rotY, s_rotZ);

            activeWorld.up(dt);
            
            if (gesture.h1) {
                let w = s2w(gesture.h1.x * W, gesture.h1.y * H);
                if (w.hit) activeWorld.pm(w.x, w.z, 0.5 + (s_fist * 2.0));
            }
            if (gesture.h2) {
                let w = s2w(gesture.h2.x * W, gesture.h2.y * H);
                if (w.hit) activeWorld.pm(w.x, w.z, 0.5 + (s_fist * 2.0));
            }

            renderer.render(scene, camera);

        } else if (currentCategory === 'game') {
            ctx.clearRect(0, 0, W, H);
            
            if (Math.random() < (currentMode === 'bubbles' ? 0.03 : 0.02)) spawnGameEntity();

            for (let i = entities.length - 1; i >= 0; i--) {
                let e = entities[i];
                e.y -= e.sy;
                if (currentMode === 'bubbles') { e.wobble += 0.05; e.x += Math.sin(e.wobble)*0.5 + e.sx; }
                
                ctx.save();
                ctx.translate(e.x, e.y);
                if (currentMode === 'bubbles') {
                    ctx.beginPath(); ctx.arc(0,0,e.r,0,Math.PI*2);
                    ctx.fillStyle = e.color+'40'; ctx.fill();
                    ctx.strokeStyle = e.color; ctx.lineWidth=2; ctx.stroke();
                } else {
                    ctx.scale(1+Math.sin(time*3+e.seed)*0.05, 1+Math.cos(time*4+e.seed)*0.05);
                    ctx.rotate(Math.sin(time+e.seed)*0.2);
                    ctx.font = `${e.r*2}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(e.emoji, 0, 0);
                }
                ctx.restore();

                let hit = false;
                if (gesture.h1 && Math.hypot((gesture.h1.x*W) - e.x, (gesture.h1.y*H) - e.y) < e.r + 30) hit = true;
                if (gesture.h2 && Math.hypot((gesture.h2.x*W) - e.x, (gesture.h2.y*H) - e.y) < e.r + 30) hit = true;

                if (hit) {
                    createSplash(e.x, e.y, e.color, currentMode==='fruits');
                    gameScore += (currentMode==='fruits' ? 15 : 1);
                    scoreEl.innerText = gameScore;
                    entities.splice(i, 1);
                } else if (e.y + e.r < -100) {
                    entities.splice(i, 1);
                }
            }

            for (let i = particles2D.length - 1; i >= 0; i--) {
                let p = particles2D[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.alpha -= 0.03;
                if (p.alpha <= 0) { particles2D.splice(i, 1); continue; }
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fillStyle = p.isFruit ? `${p.color}${p.alpha})` : p.color;
                ctx.globalAlpha = p.isFruit ? 1 : p.alpha;
                ctx.fill(); ctx.globalAlpha = 1;
            }

            ctx.strokeStyle = gesture.fist ? '#ff4444' : '#fff';
            ctx.fillStyle = gesture.fist ? 'rgba(255,68,68,0.6)' : 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 2;
            
            if (gesture.h1) {
                ctx.beginPath(); ctx.arc(gesture.h1.x*W, gesture.h1.y*H, gesture.fist ? 10 : 15, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            }
            if (gesture.h2) {
                ctx.beginPath(); ctx.arc(gesture.h2.x*W, gesture.h2.y*H, gesture.fist ? 10 : 15, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
            }
        }
    }

    // --- Tracking Bootstrap ---
    function checkFist(lm) {
        let wr = lm[0];
        let sum = 0;
        [8, 12, 16, 20].forEach(i => sum += Math.hypot(lm[i].x - wr.x, lm[i].y - wr.y));
        return (sum / 4) < 0.25; 
    }

    function onResults(results) {
        gesture.count = 0;
        gesture.h1 = null; 
        gesture.h2 = null;
        gesture.fist = false;

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            statusEl.textContent = `Tracking (${camRotation}\u00B0)`;
            statusEl.style.color = "#00ff78";
            
            gesture.count = results.multiHandLandmarks.length;
            
            let h1 = results.multiHandLandmarks[0];
            gesture.h1 = { x: 1.0 - h1[9].x, y: h1[9].y, fist: checkFist(h1) };
            gesture.fist = gesture.h1.fist;

            if (gesture.count > 1) {
                let h2 = results.multiHandLandmarks[1];
                gesture.h2 = { x: 1.0 - h2[9].x, y: h2[9].y, fist: checkFist(h2) };
                
                gesture.fist = gesture.h1.fist || gesture.h2.fist;
                
                gesture.dist = Math.hypot(gesture.h1.x - gesture.h2.x, gesture.h1.y - gesture.h2.y);
                gesture.zoom = gesture.dist;
                
                gesture.angle = Math.atan2(gesture.h2.y - gesture.h1.y, gesture.h1.x - gesture.h2.x); 
                
                gesture.midX = (gesture.h1.x + gesture.h2.x) / 2;
                gesture.midY = (gesture.h1.y + gesture.h2.y) / 2;
                
                gestureStatusEl.textContent = gesture.fist ? "CRUSHING" : "MANIPULATING";
                gestureStatusEl.style.color = gesture.fist ? "#ff4444" : "#00c8ff";
            } else {
                gestureStatusEl.textContent = gesture.fist ? "CRUSHING" : "POINTER ACTIVE";
                gestureStatusEl.style.color = gesture.fist ? "#ff4444" : "#00ff78";
            }

        } else {
            statusEl.textContent = `Searching... (${camRotation}\u00B0)`;
            statusEl.style.color = "rgba(255,255,255,0.4)";
            gestureStatusEl.textContent = "IDLE";
            gestureStatusEl.style.color = "rgba(255,255,255,0.4)";
        }
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ 
        maxNumHands: 2, 
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: 0.6, 
        minTrackingConfidence: 0.6 
    });
    hands.onResults(onResults);

    const cameraInstance = new Camera(videoElement, { 
        onFrame: async () => { 
            if (camRotation === 0) {
                await hands.send({image: videoElement}); 
            } else {
                const vw = videoElement.videoWidth;
                const vh = videoElement.videoHeight;
                if (!vw || !vh) return;
                
                if (camRotation === 90 || camRotation === 270) {
                    processCanvas.width = vh;
                    processCanvas.height = vw;
                } else {
                    processCanvas.width = vw;
                    processCanvas.height = vh;
                }
                
                processCtx.save();
                processCtx.translate(processCanvas.width / 2, processCanvas.height / 2);
                processCtx.rotate(camRotation * Math.PI / 180);
                processCtx.drawImage(videoElement, -vw / 2, -vh / 2, vw, vh);
                processCtx.restore();
                
                await hands.send({image: processCanvas});
            }
        }, 
        width: isMobile ? 640 : 1280, 
        height: isMobile ? 480 : 720,
        facingMode: 'user'
    });
    cameraInstance.start();

    window.addEventListener('resize', () => {
        W = window.innerWidth; 
        H = window.innerHeight;
        renderer.setSize(W, H); 
        camera.aspect = W / H; 
        camera.updateProjectionMatrix();
        gameCanvas.width = W; 
        gameCanvas.height = H;
    });

    setMode('pond', 'world');
    animate();

</script>
</body>
</html>
